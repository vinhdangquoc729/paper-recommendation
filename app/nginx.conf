server {
    listen 80;
    root /usr/share/nginx/html;

    # Cùng origin với giao diện: cookie phiên và PDF nhúng iframe hoạt động như khi dev
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả index.html cho React Router
    location / {
        try_files $uri /index.html;
    }
}
